# Prometheus cho FIN-07.
#
# Nguyên tắc chọn đối tượng đo: chỉ lấy những thứ trả lời được một câu hỏi vận
# hành cụ thể. Thu thập cho đủ bộ rồi không ai nhìn là cách nhanh nhất biến
# giám sát thành chi phí thuần.
#
#   node      → máy còn chỗ không (CPU, RAM, đĩa)
#   cadvisor  → container nào đang ăn tài nguyên
#   application → người dùng thật thấy gì (tốc độ, mã lỗi)
#   redis     → hàng đợi tác vụ có bị ứ không
#   postgres  → Cloud SQL còn nhận kết nối không
#
# Ứng dụng đẩy metrics qua OTLP; Collector mở endpoint scrape 8889. /metrics
# trên API chỉ là diagnostic cục bộ, không phải một pipeline thứ hai.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Nhãn gắn vào mọi chuỗi số liệu rời khỏi Prometheus này. Có nó thì sau này
  # gộp nhiều môi trường vào một Grafana mới phân biệt được.
  external_labels:
    environment: "${APP_ENV}"
    project: fin07

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Lấy chỉ số ứng dụng THẲNG từ API, không qua otel-collector.
  #
  # Cấu hình cũ trỏ vào `otel-collector:8889`, nhưng không có service nào tên
  # otel-collector trong bất kỳ file compose nào của repo. Prometheus vì thế
  # không bao giờ thu được một chỉ số fin07_* nào, và sáu nhóm chỉ số trên
  # Grafana trống mà không có lỗi nào chỉ ra vì sao — target chỉ đơn giản là
  # "down" trong một danh sách mà không ai nhìn.
  #
  # API đã phơi sẵn /metrics ở định dạng Prometheus, nên bỏ hẳn một tầng trung
  # gian là cách gọn nhất: bớt một thành phần phải dựng và phải theo dõi.
  - job_name: fin07-application
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Worker phải scrape riêng: chỉ số OpenTelemetry sống trong tiến trình phát ra
  # chúng, và TOÀN BỘ công việc của tầng tác tử chạy ở worker, không ở API.
  - job_name: fin07-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9108"]
        labels:
          service: worker

  # Máy chủ: CPU, RAM, đĩa, mạng.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Caddy đứng trước toàn bộ hệ thống nên số liệu của nó là thứ người dùng
  # thật sự trải nghiệm: bao nhiêu request, chậm bao nhiêu, lỗi bao nhiêu.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Cloud SQL. Exporter chạy trong mạng compose và nối ra ngoài bằng cùng
  # chuỗi kết nối mà ứng dụng dùng.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Jaeger v2 exposes internal Collector telemetry on 8888 when reachable.
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]
