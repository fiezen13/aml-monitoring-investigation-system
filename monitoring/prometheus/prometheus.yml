# Prometheus cho FIN-07.
#
# Nguyên tắc chọn đối tượng đo: chỉ lấy những thứ trả lời được một câu hỏi vận
# hành cụ thể. Thu thập cho đủ bộ rồi không ai nhìn là cách nhanh nhất biến
# giám sát thành chi phí thuần.
#
#   node      → máy còn chỗ không (CPU, RAM, đĩa)
#   cadvisor  → container nào đang ăn tài nguyên
#   caddy     → người dùng thật thấy gì (tốc độ, mã lỗi)
#   redis     → hàng đợi tác vụ có bị ứ không
#   postgres  → Cloud SQL còn nhận kết nối không
#
# Chưa có: metrics ở tầng ứng dụng. `src/` chưa expose /metrics, nên độ trễ
# theo từng endpoint hiện đo gián tiếp qua Caddy. Xem docs/operations/MONITORING.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Nhãn gắn vào mọi chuỗi số liệu rời khỏi Prometheus này. Có nó thì sau này
  # gộp nhiều môi trường vào một Grafana mới phân biệt được.
  external_labels:
    environment: "${APP_ENV}"
    project: fin07

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Máy chủ: CPU, RAM, đĩa, mạng.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # KHÔNG có cAdvisor — số liệu theo từng container hiện không thu được.
  #
  # Docker 29 dùng containerd snapshotter (`Storage Driver: overlayfs`,
  # `driver-type: io.containerd.snapshotter.v1`), bỏ hẳn bố cục
  # /var/lib/docker/image/overlay2/layerdb mà cAdvisor dựa vào để nhận diện
  # container. Nó khởi động được nhưng không đăng ký nổi container nào:
  #
  #   Failed to create existing container: … failed to identify the
  #   read-write layer ID … no such file or directory
  #
  # Đã thử v0.49.1 và v0.52.1, cả hai đều cho 0 chuỗi có nhãn `name`, kể cả
  # khi trỏ thẳng vào containerd bằng --containerd-namespace=moby.
  #
  # Hệ quả chấp nhận được: node-exporter vẫn cho toàn bộ tài nguyên máy, và
  # đây là VM chạy đúng một hệ thống — biết máy hết RAM quan trọng hơn biết
  # container nào chiếm phần lớn. Thà thiếu một tầng số liệu còn hơn để một
  # thành phần hỏng nằm trong stack và ngốn CPU mà không cho lại gì.

  # Caddy đứng trước toàn bộ hệ thống nên số liệu của nó là thứ người dùng
  # thật sự trải nghiệm: bao nhiêu request, chậm bao nhiêu, lỗi bao nhiêu.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Cloud SQL. Exporter chạy trong mạng compose và nối ra ngoài bằng cùng
  # chuỗi kết nối mà ứng dụng dùng.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
