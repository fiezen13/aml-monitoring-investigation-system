registry_id: ABM-BANK-SOURCE-REGISTRY
registry_version: 0.1.0
status: proposed
last_reviewed: 2026-08-07
owner: Bao
scope: ABM-BANK Level-1 commercial-bank MVP

sources:
  - source_id: SRC_IBM_AML_DATA_2023
    name: IBM Transactions for Anti-Money Laundering
    source_type: public_synthetic_dataset
    reference: https://github.com/IBM/AML-Data
    version: repository main branch and linked Kaggle release, reviewed 2026-08-07
    license_or_usage_note: >-
      Repository code is Apache-2.0; IBM states that the released data is
      CDLA-Sharing-1.0. Preserve attribution and review the downloaded asset's
      terms before profiling or redistribution.
    geography: synthetic global banking world
    time_period: synthetic; dataset release documented in 2023
    domain: bank transactions and synthetic AML scenarios
    fields_available:
      - timestamp
      - origin bank and account
      - destination bank and account
      - amount paid and received
      - currencies
      - payment format
      - transaction laundering label
    population_scope: synthetic individuals, companies, banks, and transactions
    use_for:
      - transaction schema compatibility research
      - payment-format and currency-pair support
      - temporal and amount distribution sensitivity baselines
      - graph scale and transaction-network benchmark comparisons
      - profiling-code acceptance tests against the locally supported IBM format
    do_not_use_for:
      - Vietnamese customer demographics
      - Vietnamese bank channel shares
      - real-world AML prevalence
      - exact scenario quotas
      - person-record linkage to any other source
    quality_notes: >-
      Fully synthetic with known labels and large scale. The repository already
      supports its CSV shape, including duplicate Account headers and string bank IDs.
    known_biases:
      - generated by IBM's virtual world rather than observed Vietnamese bank data
      - laundering labels are complete simulator truth, unlike operational labels
      - dataset variants differ in scale and laundering intensity
    confidence:
      schema_and_pipeline_testing: high
      generic_transaction_shape: medium
      Vietnam_population_representation: very_low
      AML_prevalence: prohibited

  - source_id: SRC_IBM_AMLSIM_2021
    name: IBM AMLSim
    source_type: open_source_simulator
    reference: https://github.com/IBM/AMLSim
    version: master branch, reviewed 2026-08-07
    license_or_usage_note: Apache-2.0 repository; retain notices and verify terms of any separately downloaded outputs
    geography: synthetic generic banking network
    time_period: software project cited as 2021; synthetic run time is configurable
    domain: multi-agent bank transaction and AML-pattern simulation
    fields_available:
      - account graph configuration
      - transaction edges
      - normal transaction models
      - configurable AML pattern injection
      - alert and typology outputs
    population_scope: configurable synthetic accounts and transaction networks
    use_for:
      - simulator architecture comparison
      - parameter-file and reproducibility patterns
      - graph-generation methodology
      - typology module interface design
      - scale-test methodology
    do_not_use_for:
      - copying AMLSim output and calling it ABM-BANK
      - Vietnamese customer or business population parameters
      - real AML prevalence
      - unreviewed reuse of its default constants
    quality_notes: >-
      Mature public simulator intended for ML and graph research, but its README
      warns that non-master branches and some wiki material are stale.
    known_biases:
      - normal behavior and topology are simulator assumptions
      - legacy Java and Python dependencies limit direct reuse
      - generated patterns are benchmark constructs, not measured incidence
    confidence:
      simulator_architecture: high
      graph_methodology: medium
      Vietnam_parameterization: very_low
      AML_prevalence: prohibited

  - source_id: SRC_SYNTHAML_2023
    name: SynthAML
    source_type: public_synthetic_dataset_and_data_descriptor
    reference: https://doi.org/10.1038/s41597-023-02569-2
    data_reference: https://doi.org/10.6084/m9.figshare.c.6504421.v1
    version: version of record 2023-09-28; Figshare collection v1
    license_or_usage_note: >-
      Article is CC BY 4.0. Verify the Figshare item license before downloading
      or redistributing the data; record the item checksum in a source profile.
    geography: Denmark
    time_period: source alerts from 2020-2021; synthetic release 2023
    domain: retail-bank AML alerts and customer transaction histories
    fields_available:
      - alert ID and date
      - alert outcome
      - transaction timestamp
      - credit or debit entry
      - card, cash, international, or wire type
      - normalized log transaction size
    population_scope: >-
      synthetic private-client alert population derived from a stratified subset
      of Spar Nord data; 20,000 alerts and more than 16 million transactions
    use_for:
      - alert-relative temporal history methodology
      - transaction type mix sensitivity checks
      - point-in-time split and concept-drift experiments
      - copula and conditional synthesis methodology review
      - high-volume transaction-count calibration sanity checks
    do_not_use_for:
      - Vietnamese population or currency distributions
      - businesses or graph topology
      - true client-risk proportions
      - real alert conversion or AML prevalence
      - direct recovery of raw transaction amounts
    quality_notes: >-
      Based on real bank distributions and technically validated, but amounts are
      transformed and standardized. The authors explicitly state that stratification
      and the approximately 17 percent reported-alert share are not real prevalence.
    known_biases:
      - only private clients, not businesses
      - alert-conditioned sample rather than the full bank population
      - Danish products and bank-specific transaction taxonomy
      - target leakage noted by authors in one validation experiment
    confidence:
      alert_temporal_methodology: high
      transaction_type_shape: medium
      raw_amount_calibration: very_low
      Vietnam_population_representation: very_low
      AML_prevalence: prohibited

  - source_id: SRC_WB_GLOBAL_FINDEX_VNM_2024
    name: World Bank Global Findex 2025 - Viet Nam 2024
    source_type: nationally_representative_survey
    reference: https://www.worldbank.org/en/publication/globalfindex/download-data
    microdata_reference: https://microdata.worldbank.org/catalog/7998
    version: 2025 edition using calendar-year 2024 survey data
    license_or_usage_note: World Bank indicator pages state CC BY 4.0; retain attribution and microdata terms
    geography: Viet Nam
    time_period: 2024
    domain: financial inclusion, payments, saving, borrowing, and digital access
    fields_available:
      - account ownership
      - digital payments
      - formal saving and borrowing
      - wage and government payments into accounts
      - phone and internet access
      - age, gender, income-group, labor-force, and urban-rural aggregates
    population_scope: nationally representative adults age 15 and older; Viet Nam microdata sample
    use_for:
      - account-ownership constraints at population level
      - conditional digital-channel propensity
      - salary and government-payment participation constraints
      - age, income-group, labor-force, and urban-rural harmonization margins
    do_not_use_for:
      - number of accounts per bank customer without another source
      - transaction counts, amounts, or inter-arrival times
      - business population generation
      - AML prevalence or typology parameters
      - treating unweighted sample counts as population shares
    quality_notes: >-
      Authoritative survey with weights and documented methodology. Aggregate
      financial inclusion is not equivalent to the distribution among one bank's customers.
    known_biases:
      - self-reported annual behavior
      - excludes people under age 15
      - survey margins do not represent a particular commercial bank portfolio
    confidence:
      national_account_access: high
      conditional_digital_use: high
      single_bank_portfolio: low
      transaction_behavior: prohibited

  - source_id: SRC_VN_NSO_LFS_2024
    name: Viet Nam National Statistics Office - Labour Force Survey 2024
    source_type: official_population_statistics
    reference: https://www.gso.gov.vn/en/employment/
    version: Report on Labour Force Survey 2024, reviewed 2026-08-07
    license_or_usage_note: Official statistics; cite the National Statistics Office and preserve publication metadata
    geography: Viet Nam
    time_period: 2024
    domain: population, labor, employment, occupation, and income
    fields_available:
      - labor-force status
      - employment by age, sex, residence, province, industry, and occupation
      - worker income summaries
      - urban and rural breakdowns
    population_scope: Viet Nam labor-force survey population
    use_for:
      - age, region, urban-rural, employment, occupation, and income margins
      - conditional population synthesis constraints
      - salary-agent segmentation
    do_not_use_for:
      - direct person-level join with Global Findex
      - bank-customer portfolio shares without selection modeling
      - transaction behavior or AML prevalence
      - exact declared-income bands without documented transformation
    quality_notes: >-
      Official population statistics. Detailed table availability and classification
      versions must be captured in a downloaded source profile before parameter derivation.
    known_biases:
      - labor-force scope differs from adult financial-inclusion scope
      - income is not the same as bank-declared income or account turnover
      - banked customers are a selected subset of the population
    confidence:
      population_employment_margins: high
      income_band_design: medium
      bank_customer_selection: low

  - source_id: SRC_VN_NSO_ENTERPRISES_2024
    name: Viet Nam National Statistics Office - Enterprise statistics 2024
    source_type: official_business_statistics
    reference: https://www.gso.gov.vn/en/enterprises/
    publication_reference: https://www.gso.gov.vn/en/statistic-book/
    version: Statistical Yearbook of Viet Nam 2024 and current enterprise tables
    license_or_usage_note: Official statistics; cite table, classification, unit, reference year, and access date
    geography: Viet Nam
    time_period: principally 2024 with historical annual tables
    domain: enterprises and non-farm individual business establishments
    fields_available:
      - enterprise counts by industry, province, legal type, and size
      - employees by industry and province
      - capital and net turnover aggregates
      - compensation and profit aggregates
      - non-farm individual business establishments
    population_scope: registered acting enterprises and published establishment populations
    use_for:
      - business industry, region, legal-type, and employee-size margins
      - business turnover-band constraints
      - merchant and employer population proportions
      - hard-negative business archetype population constraints
    do_not_use_for:
      - person-record joins to household or financial-inclusion surveys
      - daily transaction distributions
      - bank-specific SME portfolio composition
      - beneficial ownership networks
      - AML prevalence
    quality_notes: >-
      Authoritative aggregate tables; denominators and coverage differ across acting
      enterprises, enterprises with business outcomes, and household businesses.
    known_biases:
      - formal enterprises and household establishments use different frames
      - turnover aggregates require a fitted within-cell distribution
      - bank customers differ from the national enterprise population
    confidence:
      national_business_margins: high
      business_turnover_bands: medium
      bank_SME_portfolio: low

  - source_id: SRC_SBV_ANNUAL_REPORT_2023
    name: State Bank of Viet Nam Annual Report 2023
    source_type: official_banking_and_payment_statistics
    reference: https://www.sbv.gov.vn/documents/d/sbv_portal/590044
    version: 2023 Annual Report, reviewed 2026-08-07
    license_or_usage_note: Official publication; cite the report and table/page used
    geography: Viet Nam
    time_period: 2019-2023 series with 2023 reporting focus
    domain: banking system and payment infrastructure
    fields_available:
      - payment-system aggregates
      - payment instruments and infrastructure
      - banking-sector aggregates
      - NAPAS and retail-payment context
    population_scope: aggregate Viet Nam banking and payment system
    use_for:
      - macro constraints on channel and payment-system scale
      - supported payment rails and terminology
      - trend and sensitivity checks for digital-payment growth
    do_not_use_for:
      - individual transaction amount or frequency distributions
      - customer demographics
      - one-bank market shares
      - AML prevalence or scenario quotas
    quality_notes: >-
      Official aggregate statistics. Exact table extraction, unit normalization,
      and newer-report supersession must be documented during profiling.
    known_biases:
      - system-wide aggregates hide bank and customer heterogeneity
      - counts and values may cover different instrument definitions
      - annual totals do not determine intraday behavior
    confidence:
      payment_rail_support: high
      macro_channel_constraints: medium
      customer_level_behavior: prohibited

  - source_id: SRC_FATF_PML_2018
    name: FATF Professional Money Laundering report
    source_type: official_typology_report
    reference: https://www.fatf-gafi.org/en/publications/Methodsandtrends/Professional-money-laundering.html
    version: published 2018-07-26
    license_or_usage_note: Public FATF report; use with attribution and do not redistribute beyond applicable terms
    geography: multi-jurisdictional
    time_period: case material available to FATF before July 2018
    domain: professional laundering organizations, roles, and network mechanisms
    fields_available:
      - role and function descriptions
      - money mule, proxy, cash-controller, and digital-money network structures
      - account-management and layering mechanisms
      - qualitative case studies
    population_scope: selected typology cases contributed across jurisdictions
    use_for:
      - scenario actor roles and preconditions
      - mule, proxy, and controller network topology design
      - causal stage and observable-evidence design
      - scenario acceptance criteria
    do_not_use_for:
      - frequency, prevalence, or scenario quotas
      - exact transaction amounts or delays
      - Vietnamese population parameters
      - treating a red flag as proof of crime
    quality_notes: >-
      Authoritative qualitative typology evidence, not a representative statistical sample.
    known_biases:
      - case-selection and reporting bias
      - cross-jurisdictional legal and product differences
      - operational detail is intentionally incomplete
    confidence:
      role_and_network_structure: high
      exact_numeric_parameters: low
      prevalence: prohibited

  - source_id: SRC_FINCEN_FUNNEL_2014
    name: FinCEN Advisory FIN-2014-A005 - Funnel Accounts and TBML
    source_type: official_typology_advisory
    reference: https://www.fincen.gov/resources/advisories/fincen-advisory-fin-2014-a005
    version: issued 2014-05-28
    license_or_usage_note: United States government advisory; cite advisory number and issue date
    geography: United States and Mexico context
    time_period: evidence available through May 2014
    domain: funnel accounts and trade-based money laundering red flags
    fields_available:
      - fan-in cash-deposit pattern
      - geographic dispersion
      - consolidation-account structure
      - low-dwell outbound wires or checks
      - legitimate-activity cautions
    population_scope: advisory based on law-enforcement information and SAR patterns
    use_for:
      - funnel and fan-in/fan-out scenario topology
      - temporal ordering of deposits, consolidation, and outbound movement
      - hard-negative requirements
      - observable red-flag combinations
    do_not_use_for:
      - importing the US 10000 USD threshold into Viet Nam
      - exact deposit counts, amounts, or dwell-time parameters
      - AML prevalence
      - labeling any single red flag as criminal
    quality_notes: >-
      FinCEN explicitly warns that indicators can be legitimate and must be assessed
      together with expected customer activity and other information.
    known_biases:
      - US/Mexico regulatory and geographic context
      - advisory focuses on a selected threat pattern
      - thresholds and reporting obligations are jurisdiction-specific
    confidence:
      funnel_topology: high
      observable_pattern: high
      numeric_parameterization_for_Vietnam: very_low
      prevalence: prohibited

  - source_id: SRC_ELLIPTIC_2019
    name: Elliptic Bitcoin Transaction Graph
    source_type: public_real_blockchain_graph_dataset
    reference: https://www.kaggle.com/datasets/ellipticco/elliptic-data-set
    paper_reference: https://arxiv.org/abs/1908.02591
    version: Kaggle release associated with the 2019 paper
    license_or_usage_note: CC BY-NC-ND 4.0; profiling only, no commercial or derivative redistribution without review
    geography: global Bitcoin network
    time_period: 49 approximately two-week time steps in the released graph
    domain: temporal cryptocurrency transaction graph
    fields_available:
      - directed transaction graph
      - 203769 transaction nodes
      - 234355 flow edges
      - 166 node features
      - licit, illicit, and unknown labels
      - coarse time steps
    population_scope: anonymized subset of Bitcoin transactions and attributed entity classes
    use_for:
      - graph profiling implementation tests
      - temporal graph split methodology
      - degree, component, and neighborhood-statistic methods
      - graph scalability benchmarks
    do_not_use_for:
      - bank-account graph degree targets
      - Vietnamese fiat payment behavior
      - AML prevalence
      - transaction amount distributions for ABM-BANK
      - copying opaque derived features into Bank View
    quality_notes: >-
      Real public blockchain structure and a useful methodology benchmark, but it is
      a transaction-node graph with many unknown labels and partially opaque features.
    known_biases:
      - cryptocurrency UTXO mechanics differ from bank accounts
      - labeled nodes are a selected minority
      - features include proprietary aggregation with incomplete semantics
      - license restricts derivative and commercial use
    confidence:
      graph_profiling_methodology: high
      bank_graph_structure: very_low
      Vietnam_fiat_behavior: prohibited
      AML_prevalence: prohibited
