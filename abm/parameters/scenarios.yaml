registry_version: 0.1.0
component: scenarios_and_hard_negatives
last_reviewed: 2026-08-07
parameters:
  - parameter_id: AML_SCENARIO_QUOTAS_001
    description: Intentional benchmark scenario counts for the full MVP release; not prevalence.
    value: {STRUCTURING: 30, RAPID_PASS_THROUGH: 25, MULE_FUNNEL: 20, FAN_IN_FAN_OUT: 20, CIRCULAR_LAYERING: 15}
    source_ids: [SRC_FATF_PML_2018, SRC_FINCEN_FUNNEL_2014]
    derivation_method: Benchmark coverage quota selected for model evaluation.
    assumption: true
    confidence: low
    sensitivity_range: {scale: [0.5, 2.0]}
    effect_on_simulation: Controls positive benchmark instances only.
    reason: Public typology reports do not establish population prevalence.

  - parameter_id: AML_STRUCTURING_001
    description: Structural configuration for benchmark cash-deposit structuring episodes.
    value: {actor_count: [1, 2], deposit_count: [5, 11], benchmark_threshold_vnd: 400000000, amount_fraction: [0.10, 0.23], episode_days: [2, 6], consolidation_delay_hours: [6, 30]}
    source_ids: [SRC_FINCEN_FUNNEL_2014]
    derivation_method: Qualitative typology mapped to explicit benchmark ranges; threshold is synthetic and not a legal reporting threshold.
    assumption: true
    confidence: low
    sensitivity_range: {deposit_count: [4, 15], amount_fraction: [0.06, 0.24]}
    effect_on_simulation: Creates repeated deposits and later consolidation observable to the bank.
    reason: Numeric details are not portable from the US advisory to Viet Nam.

  - parameter_id: AML_RAPID_PASS_THROUGH_001
    description: Rapid inbound-to-outbound benchmark episode.
    value: {incoming_count: [2, 5], retained_fraction: [0.01, 0.04], dwell_minutes: [8, 180]}
    source_ids: [SRC_FATF_PML_2018, SRC_FINCEN_FUNNEL_2014]
    derivation_method: Qualitative rapid-movement pattern with explicit sensitivity range.
    assumption: true
    confidence: low
    sensitivity_range: {dwell_minutes: [3, 720], retained_fraction: [0.005, 0.08]}
    effect_on_simulation: Creates balance-turnover and velocity signals.
    reason: No representative public dwell-time distribution was identified.

  - parameter_id: AML_MULE_FUNNEL_001
    description: Mule/funnel network size and forwarding behavior.
    value: {mules: [3, 7], source_accounts: [5, 12], incoming_per_source: [1, 3], retained_fraction: [0.01, 0.05], dwell_minutes: [20, 360], shared_device_probability: 0.65}
    source_ids: [SRC_FATF_PML_2018, SRC_FINCEN_FUNNEL_2014]
    derivation_method: Role/topology evidence plus explicit numeric benchmark assumptions.
    assumption: true
    confidence: low
    sensitivity_range: {mules: [2, 10], shared_device_probability: [0.35, 0.85]}
    effect_on_simulation: Creates multi-hop flow and shared-device graph evidence.
    reason: Typology reports are qualitative and selected-case based.

  - parameter_id: AML_FAN_IN_FAN_OUT_001
    description: Collection hub fan-in/fan-out configuration.
    value: {fan_in: [8, 18], fan_out: [4, 10], retained_fraction: [0.02, 0.08], episode_hours: [12, 72]}
    source_ids: [SRC_FINCEN_FUNNEL_2014]
    derivation_method: Advisory topology mapped to explicit benchmark ranges.
    assumption: true
    confidence: low
    sensitivity_range: {fan_in: [5, 25], fan_out: [3, 15]}
    effect_on_simulation: Creates high weighted in/out degree and short-window bursts.
    reason: Advisory does not supply representative numeric distributions.

  - parameter_id: AML_CIRCULAR_LAYERING_001
    description: Circular internal flow configuration.
    value: {ring_size: [4, 8], rounds: [1, 3], retained_fraction_per_hop: [0.005, 0.025], dwell_minutes: [15, 360]}
    source_ids: [SRC_FATF_PML_2018, SRC_IBM_AMLSIM_2021]
    derivation_method: Layering/network methodology with explicit benchmark ranges.
    assumption: true
    confidence: low
    sensitivity_range: {ring_size: [3, 12], rounds: [1, 4]}
    effect_on_simulation: Creates time-respecting cycles without adding hidden fields to Bank View.
    reason: Exact ring distributions are not available from representative public evidence.

  - parameter_id: HARD_NEGATIVE_QUOTAS_001
    description: Intentional legitimate benchmark control counts.
    value: {SALARY_DISBURSEMENT: 20, MARKETPLACE_SELLER: 25, FAMILY_REMITTANCE_HUB: 25, SEASONAL_BUSINESS: 20, PROPERTY_OR_INSURANCE_EVENT: 20, TREASURY_MOVEMENT: 15}
    source_ids: [SRC_FINCEN_FUNNEL_2014, SRC_VN_NSO_ENTERPRISES_2024]
    derivation_method: Benchmark control quota selected to collide with suspicious rules.
    assumption: true
    confidence: low
    sensitivity_range: {scale: [0.5, 2.0]}
    effect_on_simulation: Controls hard-negative evaluation coverage.
    reason: These are evaluation quotas, not population prevalence.

  - parameter_id: HARD_NEGATIVE_PATTERN_001
    description: Observable ranges for legitimate high-volume patterns.
    value: {counterparties: [8, 35], burst_transactions: [8, 30], large_event_amount_vnd: [150000000, 2500000000], treasury_retained_fraction: [0.0, 0.02]}
    source_ids: [SRC_VN_NSO_ENTERPRISES_2024, SRC_FINCEN_FUNNEL_2014]
    derivation_method: Explicit benchmark ranges designed to overlap rule indicators while retaining legitimate causes.
    assumption: true
    confidence: low
    sensitivity_range: {counterparties: [5, 50], burst_transactions: [5, 45]}
    effect_on_simulation: Controls difficulty and false-positive evaluation.
    reason: No representative public hard-negative transaction sample was identified.

