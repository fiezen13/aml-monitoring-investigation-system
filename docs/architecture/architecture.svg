<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title>FIN-07 — Kiến trúc production</title>
  <desc>Sơ đồ kiến trúc production của FIN-07 AML Operations Console: trình duyệt qua Caddy tới console web, API FastAPI và worker nền, Cloud SQL PostgreSQL và Redis, ba nhánh mô hình chấm điểm ngoại tuyến, trợ lý Gemini và ngăn xếp quan trắc.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6673"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="28" y="40" font-size="21" font-weight="700" fill="#14181f">FIN-07 — Kiến trúc production</text>
  <text x="28" y="62" font-size="13" fill="#5b6673">AML Operations Console · một VM GCP (asia-southeast1) · Cloud SQL tách rời · dữ liệu IBM AML + SAML-D + Elliptic</text>

  <!-- người dùng -->
  <rect x="28" y="86" width="196" height="52" rx="8" fill="#eef2f7" stroke="#c3ccd8"/>
  <text x="126" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">Người dùng</text>
  <text x="126" y="128" font-size="11" text-anchor="middle" fill="#5b6673">Chuyên viên · Quản lý · Quản trị</text>

  <!-- gemini -->
  <rect x="776" y="86" width="196" height="52" rx="8" fill="#f6eef8" stroke="#d6bede"/>
  <text x="874" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">Google Gemini API</text>
  <text x="874" y="128" font-size="11" text-anchor="middle" fill="#5b6673">gemini-3.1-flash-lite</text>

  <!-- GCP VM -->
  <rect x="28" y="164" width="700" height="404" rx="10" fill="#fbfcfe" stroke="#aab6c6" stroke-dasharray="6 4"/>
  <text x="44" y="186" font-size="12" font-weight="700" fill="#5b6673">VM fin07-vm · e2-medium (2 vCPU / 4 GB) · Docker Compose</text>

  <!-- caddy -->
  <rect x="48" y="200" width="200" height="50" rx="7" fill="#e8f1fb" stroke="#a8c6e8"/>
  <text x="148" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">Caddy 2.8</text>
  <text x="148" y="240" font-size="11" text-anchor="middle" fill="#5b6673">TLS Let's Encrypt · HTTP→HTTPS</text>

  <!-- web -->
  <rect x="48" y="272" width="200" height="60" rx="7" fill="#e8f1fb" stroke="#a8c6e8"/>
  <text x="148" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">web · nginx</text>
  <text x="148" y="310" font-size="11" text-anchor="middle" fill="#5b6673">SPA React + Vite (build tĩnh)</text>
  <text x="148" y="325" font-size="11" text-anchor="middle" fill="#5b6673">proxy /api · /grafana</text>

  <!-- api -->
  <rect x="290" y="272" width="200" height="60" rx="7" fill="#e6f4ec" stroke="#9dcdb3"/>
  <text x="390" y="293" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">api · FastAPI / uvicorn</text>
  <text x="390" y="310" font-size="11" text-anchor="middle" fill="#5b6673">RBAC 3 vai · phiên PBKDF2</text>
  <text x="390" y="325" font-size="11" text-anchor="middle" fill="#5b6673">src.main:app</text>

  <!-- worker -->
  <rect x="290" y="356" width="200" height="60" rx="7" fill="#e6f4ec" stroke="#9dcdb3"/>
  <text x="390" y="377" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">worker</text>
  <text x="390" y="394" font-size="11" text-anchor="middle" fill="#5b6673">tác tử điều tra bất đồng bộ</text>
  <text x="390" y="409" font-size="11" text-anchor="middle" fill="#5b6673">src.worker.main</text>

  <!-- redis -->
  <rect x="532" y="314" width="176" height="52" rx="7" fill="#fdf0e6" stroke="#e8c19b"/>
  <text x="620" y="337" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">Redis 7</text>
  <text x="620" y="354" font-size="11" text-anchor="middle" fill="#5b6673">hàng đợi tác vụ</text>

  <!-- observability -->
  <rect x="48" y="446" width="660" height="104" rx="8" fill="#f4f6f9" stroke="#c3ccd8"/>
  <text x="64" y="468" font-size="12" font-weight="700" fill="#5b6673">Ngăn xếp quan trắc (docker compose profile obs — tắt vẫn chạy được hệ)</text>
  <rect x="64" y="480" width="140" height="52" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="134" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#14181f">Prometheus</text>
  <text x="134" y="519" font-size="11" text-anchor="middle" fill="#5b6673">chỉ số + exporter</text>
  <rect x="220" y="480" width="140" height="52" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="290" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#14181f">Loki</text>
  <text x="290" y="519" font-size="11" text-anchor="middle" fill="#5b6673">nhật ký tập trung</text>
  <rect x="376" y="480" width="140" height="52" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="446" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#14181f">Jaeger</text>
  <text x="446" y="519" font-size="11" text-anchor="middle" fill="#5b6673">vết phân tán (OTEL)</text>
  <rect x="532" y="480" width="160" height="52" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="612" y="502" font-size="12" font-weight="600" text-anchor="middle" fill="#14181f">Grafana</text>
  <text x="612" y="519" font-size="11" text-anchor="middle" fill="#5b6673">nhúng /grafana</text>

  <!-- cloud sql -->
  <rect x="776" y="272" width="196" height="86" rx="7" fill="#fdf0e6" stroke="#e8c19b"/>
  <text x="874" y="294" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">Cloud SQL</text>
  <text x="874" y="311" font-size="11" text-anchor="middle" fill="#5b6673">PostgreSQL 16 · SSL bắt buộc</text>
  <text x="874" y="327" font-size="11" text-anchor="middle" fill="#5b6673">giao dịch · cảnh báo · vụ việc</text>
  <text x="874" y="343" font-size="11" text-anchor="middle" fill="#5b6673">nhật ký kiểm toán bất biến</text>

  <!-- offline scoring -->
  <rect x="756" y="392" width="216" height="176" rx="10" fill="#fbfcfe" stroke="#aab6c6" stroke-dasharray="6 4"/>
  <text x="772" y="414" font-size="12" font-weight="700" fill="#5b6673">Chấm điểm NGOÀI TUYẾN</text>
  <text x="772" y="430" font-size="11" fill="#5b6673">scripts/ · không chạy lúc phục vụ</text>
  <rect x="772" y="440" width="184" height="36" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="864" y="463" font-size="11.5" text-anchor="middle" fill="#14181f">Nhánh luật nghiệp vụ</text>
  <rect x="772" y="484" width="184" height="36" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="864" y="507" font-size="11.5" text-anchor="middle" fill="#14181f">Nhánh đồ thị + MEGA-PNA</text>
  <rect x="772" y="528" width="184" height="36" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="864" y="551" font-size="11.5" text-anchor="middle" fill="#14181f">Isolation Forest hành vi</text>

  <!-- data sources -->
  <rect x="28" y="600" width="944" height="130" rx="10" fill="#f4f6f9" stroke="#c3ccd8"/>
  <text x="44" y="622" font-size="12" font-weight="700" fill="#5b6673">Nguồn dữ liệu (công khai, tổng hợp — không có khách hàng thật)</text>
  <rect x="44" y="634" width="290" height="80" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="189" y="656" font-size="12.5" font-weight="600" text-anchor="middle" fill="#14181f">IBM AML</text>
  <text x="189" y="674" font-size="11" text-anchor="middle" fill="#5b6673">LI-Small · HI-Medium</text>
  <text x="189" y="690" font-size="11" text-anchor="middle" fill="#5b6673">nhánh phục vụ hàng đợi chính</text>
  <text x="189" y="706" font-size="11" text-anchor="middle" fill="#5b6673">giữ nguyên amount + currency gốc</text>
  <rect x="350" y="634" width="290" height="80" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="495" y="656" font-size="12.5" font-weight="600" text-anchor="middle" fill="#14181f">SAML-D</text>
  <text x="495" y="674" font-size="11" text-anchor="middle" fill="#5b6673">ngân hàng xuyên biên giới</text>
  <text x="495" y="690" font-size="11" text-anchor="middle" fill="#5b6673">dùng chung bảng nghiệp vụ</text>
  <text x="495" y="706" font-size="11" text-anchor="middle" fill="#5b6673">release tham chiếu</text>
  <rect x="656" y="634" width="290" height="80" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="801" y="656" font-size="12.5" font-weight="600" text-anchor="middle" fill="#14181f">Elliptic++ (Bitcoin)</text>
  <text x="801" y="674" font-size="11" text-anchor="middle" fill="#5b6673">truy vết tài sản mã hoá</text>
  <text x="801" y="690" font-size="11" text-anchor="middle" fill="#5b6673">bitcoin_scored_tx</text>
  <text x="801" y="706" font-size="11" text-anchor="middle" fill="#5b6673">release tham chiếu</text>

  <!-- edges -->
  <path d="M126 138 L126 200" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="134" y="172" font-size="10.5" fill="#5b6673">HTTPS</text>
  <path d="M148 250 L148 272" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M248 302 L290 302" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="252" y="296" font-size="10.5" fill="#5b6673">/api</text>
  <path d="M490 302 L776 302" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="600" y="296" font-size="10.5" fill="#5b6673">SQL (sslmode=require)</text>
  <path d="M490 316 L532 332" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M490 380 L532 356" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M490 386 L776 348" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M456 356 L456 332" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M490 362 C 700 362, 830 220, 852 138" stroke="#9aa4b2" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="700" y="230" font-size="10.5" fill="#7c8795">diễn giải on-demand</text>
  <path d="M864 440 L864 372" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="872" y="392" font-size="10.5" fill="#5b6673">nạp điểm đã tính sẵn</text>
  <path d="M189 634 C 189 600, 700 600, 830 568" stroke="#5b6673" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M390 416 L390 446" stroke="#9aa4b2" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <!-- legend -->
  <rect x="756" y="164" width="216" height="86" rx="8" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="772" y="184" font-size="11.5" font-weight="700" fill="#5b6673">Ranh giới bắt buộc</text>
  <text x="772" y="202" font-size="10.5" fill="#5b6673">Tác tử AI chỉ ĐỌC, luôn bất đồng bộ.</text>
  <text x="772" y="217" font-size="10.5" fill="#5b6673">Không mũi tên nào từ tác tử quay</text>
  <text x="772" y="232" font-size="10.5" fill="#5b6673">vào đường quyết định. Cưỡng chế</text>
  <text x="772" y="244" font-size="10.5" fill="#5b6673">bằng quyền PostgreSQL, không phải quy ước.</text>
</svg>
