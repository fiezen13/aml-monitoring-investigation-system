#cloud-config
# Cài đặt nền cho máy CI của FIN-07.
#
# Ranh giới cố ý: file này chỉ cài những gì một máy trống cần để trở thành
# agent build được — Docker và vài công cụ dòng lệnh. Nó KHÔNG dựng Jenkins,
# không triển khai ứng dụng. Hai việc đó đã có jenkins/ và deploy/ lo, và
# chúng chạy được ở mọi nơi chứ không riêng AWS.
#
# Danh sách gói dưới đây khớp bước "Kiểm tra môi trường" ở đầu Jenkinsfile.
# Lệch nhau thì pipeline đỏ ngay dòng đầu kèm thông báo rõ ràng.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - make
  - unzip
  - python3
  - python3-venv
  - python3-pip
  - postgresql-client
  - shellcheck

write_files:
  - path: /etc/profile.d/fin07.sh
    permissions: "0644"
    content: |
      # Nhắc người vào máy biết mình đang ở đâu
      export FIN07_HOST=ci

runcmd:
  # --- Docker Engine và Compose v2 ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker

  # --- Node 22, cho bước build giao diện ---
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs

  # --- Giới hạn log của Docker ---
  # Không đặt thì log container ăn hết đĩa sau vài tuần chạy liên tục, và
  # triệu chứng đầu tiên nhìn thấy sẽ là build hỏng vì "no space left".
  - |
    cat > /etc/docker/daemon.json <<'JSON'
    {
      "log-driver": "json-file",
      "log-opts": { "max-size": "20m", "max-file": "5" }
    }
    JSON
  - systemctl restart docker

  # --- Thư mục làm việc ---
  - mkdir -p /opt/fin07
  - chown ubuntu:ubuntu /opt/fin07

  # --- Vùng nhớ tạm ---
  # 8 GB RAM đủ cho hoạt động bình thường, nhưng lúc build image song song
  # với hai môi trường đang chạy thì có thể chạm trần. 4 GB swap rẻ hơn nhiều
  # so với việc nâng máy, và ngăn kernel giết tiến trình giữa lúc build.
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- Dấu hiệu để biết cloud-init đã xong ---
  # Có file này nghĩa là máy sẵn sàng. Không có mà SSH vào được thì cloud-init
  # còn đang chạy hoặc đã hỏng — xem /var/log/cloud-init-output.log.
  - touch /opt/fin07/.provisioned
  - chown ubuntu:ubuntu /opt/fin07/.provisioned

final_message: "FIN-07 CI host san sang sau $UPTIME giay"
