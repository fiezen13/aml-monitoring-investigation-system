server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Đường dẫn cho healthcheck của container. Không đụng tới API nên vẫn
    # xanh khi backend sập — đó là chủ ý: hai dịch vụ, hai trạng thái sức khoẻ.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Tra tên qua DNS nội bộ của Docker ở từng request thay vì một lần lúc
    # nạp cấu hình. Với hostname viết thẳng trong proxy_pass, nginx nhớ địa
    # chỉ IP từ lúc khởi động; chỉ cần `docker compose up -d api` một lần là
    # container api có IP mới và web trả 502 cho tới khi ai đó nghĩ ra việc
    # khởi động lại nginx.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $api_upstream  api;
        proxy_pass         http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Một lượt điều tra chạy tới ba phút (ARC-001 mục 5.3); mặc định 60s
        # của nginx sẽ cắt ngang những request dài nhất.
        proxy_read_timeout 200s;
    }

    # Readiness của backend. Không nằm dưới /api/ vì đó là endpoint hạ tầng
    # của chính ứng dụng, nhưng giao diện vẫn phải đọc được: thiếu khối này
    # thì /health/ready rơi vào `try_files` bên dưới và trả về index.html,
    # khiến bảng tình trạng hệ thống báo "không phản hồi" trong khi cả
    # PostgreSQL lẫn Redis đều đang chạy.
    location /health {
        set $api_health    api;
        proxy_pass         http://$api_health:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger UI của backend — tiện cho buổi demo và cho việc kiểm chứng hợp
    # đồng API mà không phải mở thêm cổng nào ra ngoài.
    location ~ ^/(docs|redoc|openapi\.json) {
        set $api_docs      api;
        proxy_pass         http://$api_docs:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Tên file trong /assets/ có băm nội dung (index-B6Y3wHf7.js), nên nội dung
    # không bao giờ đổi dưới cùng một tên — cache vĩnh viễn được.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html thì ngược lại: nó là thứ trỏ tới bundle nào đang chạy. Trước
    # đây không khối nào đặt Cache-Control, nginx chỉ gửi ETag/Last-Modified và
    # trình duyệt tự suy đoán thời hạn — nó giữ index.html cũ, tiếp tục nạp
    # bundle cũ, và mọi lần triển khai đều không tới được người dùng cho tới khi
    # họ tự xoá cache. `no-cache` không có nghĩa là không lưu: vẫn lưu, nhưng
    # bắt buộc hỏi lại server mỗi lần, và ETag làm câu trả lời đó rẻ (304).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json;
    gzip_min_length  1024;
}
