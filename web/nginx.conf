server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Đường dẫn cho healthcheck của container. Không đụng tới API nên vẫn
    # xanh khi backend sập — đó là chủ ý: hai dịch vụ, hai trạng thái sức khoẻ.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Tra tên qua DNS nội bộ của Docker ở từng request thay vì một lần lúc
        # nạp cấu hình. Với hostname viết thẳng trong proxy_pass, nginx nhớ
        # địa chỉ IP từ lúc khởi động; chỉ cần `docker compose up -d api` một
        # lần là container api có IP mới và web trả 502 cho tới khi ai đó nghĩ
        # ra việc khởi động lại nginx.
        resolver           127.0.0.11 ipv6=off valid=10s;
        set $api_upstream  api;
        proxy_pass         http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Một lượt điều tra chạy tới ba phút (ARC-001 mục 5.3); mặc định 60s
        # của nginx sẽ cắt ngang những request dài nhất.
        proxy_read_timeout 200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json;
    gzip_min_length  1024;
}
