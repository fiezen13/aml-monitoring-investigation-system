# Chạy giao diện trên CSDL HI-Medium mà KHÔNG đụng bản LI-Small.
#
#   docker compose -f docker-compose.yml -f docker-compose.himedium.yml up -d api-hm worker-hm web-hm
#
#   LI-Small    web 5173 · api 8000 · CSDL fin07
#   HI-Medium   web 5273 · api 8100 · CSDL fin07_hi_medium
#
# Ảnh giao diện ghim cứng `http://api:8000` trong nginx. Thay vì sửa file cấu
# hình lúc chạy — cách đã hỏng một lần vì Docker Compose nội suy `$api_upstream`
# thành chuỗi rỗng và lệnh sed không khớp gì — ta cho `api-hm` một **bí danh
# mạng** tên `api` trên một mạng riêng, rồi chỉ nối `web-hm` vào mạng ấy.
#
# Trong mạng đó, `api` phân giải về `api-hm`. Giao diện không phải build lại và
# không phải biết gì, nên hai môi trường chạy đúng cùng một mã.
services:
  api-hm:
    image: ${APP_IMAGE:-fin07/app:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fin07:fin07_dev_password@postgres:5432/fin07_hi_medium
      REDIS_URL: redis://redis:6379/1
      APP_ENV: development
      LOG_LEVEL: INFO
      LLM_MODE: ${LLM_MODE:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
    ports:
      - "8100:8000"
    networks:
      default: {}
      himedium:
        aliases: [api]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-hm:
    image: ${APP_IMAGE:-fin07/app:local}
    command: ["python", "-m", "src.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://fin07:fin07_dev_password@postgres:5432/fin07_hi_medium
      REDIS_URL: redis://redis:6379/1
      APP_ENV: development
      LOG_LEVEL: INFO
      LLM_MODE: ${LLM_MODE:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
    networks: [default]
    depends_on: [api-hm]
    healthcheck:
      test: ["CMD", "python", "-m", "src.worker.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web-hm:
    image: ${WEB_IMAGE:-fin07/web:local}
    ports:
      - "5273:8080"
    # CHỈ nối vào mạng himedium: nếu cũng nối vào default thì `api` sẽ phân giải
    # về dịch vụ LI-Small và ta quay lại đúng lỗi cũ.
    networks: [himedium]
    depends_on: [api-hm]

networks:
  himedium:
    driver: bridge
