# Cấu hình Jenkins bằng mã (JCasC).
#
# File này là nguồn sự thật duy nhất cho cấu hình controller. Sửa qua giao
# diện web thì lần khởi động lại tiếp theo sẽ bị ghi đè — đó là chủ ý.
#
# Mọi bí mật lấy từ biến môi trường, không có giá trị nào nằm trong repo.
# Xem jenkins/.env.example.

jenkins:
  systemMessage: |
    FIN-07 — AI Agent phát hiện rửa tiền và giám sát tuân thủ.
    Controller này dựng từ jenkins/casc.yaml. Đừng sửa qua giao diện:
    khởi động lại là mất. Sửa file, mở pull request.

  numExecutors: 0        # Controller không chạy job. Việc build đi xuống agent.
  mode: EXCLUSIVE
  labelString: 'controller'

  # Jenkinsfile đọc hai biến này, có giá trị mặc định nếu không đặt. Nhờ vậy
  # đổi registry là đổi cấu hình controller, không phải sửa Jenkinsfile.
  globalNodeProperties:
    - envVars:
        env:
          - key: "FIN07_REGISTRY"
            value: "${FIN07_REGISTRY:-ghcr.io}"
          - key: "FIN07_IMAGE_REPO"
            value: "${FIN07_IMAGE_REPO:-ai20k-build-phase-cohort-3/p-022}"

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "View/Read"

  # Agent kết nối vào bằng giao thức inbound. Xem docs/operations/CICD.md mục 3.
  nodes:
    - permanent:
        name: "fin07-agent-1"
        labelString: "fin07 linux docker"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false

# Ghi chú: khối `security.queueItemAuthenticator` (chạy job dưới danh nghĩa
# người kích hoạt) cần plugin authorize-project. Chưa thêm vì controller
# không chạy job — mọi việc build đi xuống agent, và agent không giữ
# credentials nào ngoài những cái pipeline yêu cầu tường minh. Khi mở Jenkins
# cho nhiều nhóm dùng chung thì phải thêm plugin đó và bật lại khối này.

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
    adminAddress: "bao@fin07.local"

  timestamper:
    allPipelines: true

credentials:
  system:
    domainCredentials:
      - credentials:
          # Đẩy image lên registry.
          - usernamePassword:
              scope: GLOBAL
              id: "fin07-registry"
              username: "${REGISTRY_USER:-changeme}"
              password: "${REGISTRY_TOKEN:-changeme}"
              description: "GHCR — đẩy image FIN-07"

          # Đọc repo trên GitHub.
          - usernamePassword:
              scope: GLOBAL
              id: "fin07-github"
              username: "${GITHUB_USER:-changeme}"
              password: "${GITHUB_TOKEN:-changeme}"
              description: "GitHub — đọc mã nguồn"

          # Bí mật của staging.
          - string:
              scope: GLOBAL
              id: "fin07-staging-postgres-password"
              secret: "${STAGING_POSTGRES_PASSWORD:-changeme}"
              description: "Staging — mật khẩu PostgreSQL"
          - string:
              scope: GLOBAL
              id: "fin07-staging-agent-db-password"
              secret: "${STAGING_AGENT_DB_PASSWORD:-changeme}"
              description: "Staging — mật khẩu vai trò chỉ đọc fin07_agent"
          - string:
              scope: GLOBAL
              id: "fin07-staging-google-api-key"
              secret: "${STAGING_GOOGLE_API_KEY:-}"
              description: "Staging — khoá Gemini"

          # Bí mật của production-like.
          - string:
              scope: GLOBAL
              id: "fin07-prodlike-postgres-password"
              secret: "${PRODLIKE_POSTGRES_PASSWORD:-changeme}"
              description: "Production-like — mật khẩu PostgreSQL"
          - string:
              scope: GLOBAL
              id: "fin07-prodlike-agent-db-password"
              secret: "${PRODLIKE_AGENT_DB_PASSWORD:-changeme}"
              description: "Production-like — mật khẩu vai trò chỉ đọc fin07_agent"
          - string:
              scope: GLOBAL
              id: "fin07-prodlike-google-api-key"
              secret: "${PRODLIKE_GOOGLE_API_KEY:-}"
              description: "Production-like — khoá Gemini"

jobs:
  - script: >
      multibranchPipelineJob('fin07') {
          description('''FIN-07 — pipeline CI/CD.
              Tự phát hiện nhánh và pull request. develop triển khai staging;
              main triển khai production-like sau khi có người phê duyệt.''')

          branchSources {
              github {
                  id('fin07-github-source')
                  scanCredentialsId('fin07-github')
                  repoOwner('AI20K-Build-Phase-Cohort-3')
                  repository('P-022')
                  buildOriginBranch(true)
                  buildOriginPRMerge(true)
                  buildForkPRMerge(false)
              }
          }

          factory {
              workflowBranchProjectFactory {
                  scriptPath('Jenkinsfile')
              }
          }

          orphanedItemStrategy {
              discardOldItems {
                  numToKeep(10)
              }
          }

          triggers {
              periodicFolderTrigger {
                  interval('5m')
              }
          }
      }
