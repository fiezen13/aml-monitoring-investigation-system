# Lớp phủ cho môi trường staging.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.staging.yml up -d
#
# Dùng qua ci/deploy.sh chứ đừng gõ tay — script còn lo phần ghi lại tag đang
# chạy để quay lui được.
#
# Khác môi trường phát triển ở ba điểm, và cả ba đều có lý do:
#   1. PostgreSQL và Redis KHÔNG mở cổng ra ngoài. Trên máy cá nhân thì tiện,
#      trên máy dùng chung thì đó là một cơ sở dữ liệu phơi ra mạng.
#   2. Không build, chỉ kéo image đã qua kiểm thử. Build tại chỗ nghĩa là thứ
#      chạy trên staging không phải thứ CI vừa kiểm.
#   3. restart: always. Máy chủ khởi động lại thì hệ thống phải tự lên.

services:
  postgres:
    ports: !override []
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging bắt buộc phải có POSTGRES_PASSWORD}
      FIN07_AGENT_DB_PASSWORD: ${FIN07_AGENT_DB_PASSWORD:?staging bắt buộc phải có FIN07_AGENT_DB_PASSWORD}

  redis:
    ports: !override []
    restart: always

  migrate:
    # Chỉ áp schema; dữ liệu LI-Small được giữ giữa các lần triển khai.
    restart: "no"

  api:
    restart: always
    environment:
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  worker:
    restart: always
    environment:
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  web:
    restart: always
